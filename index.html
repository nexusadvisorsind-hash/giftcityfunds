    <link rel="preload" as="image" href="/images/hero-optimized-2025.webp" fetchpriority="high" type="image/webp">

    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Skip to Content (Accessibility) */
      .skip-to-content {
        position: absolute;
        left: -9999px;
        z-index: 999;
        padding: 1em;
        background-color: #000;
        color: #fff;
        text-decoration: none;
      }
      .skip-to-content:focus {
        left: 50%;
        transform: translateX(-50%);
        top: 0;
      }
      
      /* Critical styles for hero section - inline for faster LCP */
      body { margin: 0; font-family: 'Open Sans', system-ui, sans-serif; }
      .hero-section { position: relative; width: 100%; }
      .hero-image { width: 100%; height: auto; display: block; object-fit: cover; }
      
      /* Prevent layout shift */
      #root { min-height: 100vh; }
    </style>
    
    <!-- Defer Analytics - Load after LCP -->
    <script>
      window.addEventListener('load', function() {
        window.requestIdleCallback(function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX';
          document.head.appendChild(script);
          
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XXXXXXXXXX');
        });
      });
    </script>
