<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags (will be overridden by React Helmet) -->
    <title>GiftCity Wealth Advisory | Anup Vatyani (MFD ARN 106715) | Informational Insights on GIFT City & IFSC Funds</title>
    <meta name="description" content="GiftCity Wealth Advisory provides informational updates and educational resources on GIFT City and IFSC mutual fund frameworks. Operated by Anup Vatyani (Mutual Fund Distributor ARN 106715)." />
    <meta name="author" content="Anup Vatyani" />
    <meta name="robots" content="index, follow" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    
    <!-- Critical: Preload LCP hero image with highest priority -->
    <link rel="preload" as="image" href="/images/hero-optimized-2025.webp" fetchpriority="high" type="image/webp" imagesrcset="/images/hero-optimized-2025.webp 1920w" imagesizes="100vw">
    
    <!-- Preload critical fonts with display swap -->
    <link rel="preload" href="https://fonts.gstatic.com/s/poppins/v20/pxiByp8kv8JHgFVrLFj_Z1xlFQ.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="https://fonts.gstatic.com/s/opensans/v34/memSYaGs126MiZpBA-UvWbX2vVnXBbObj2OVZyOOSr4dVJWUgsjZ0B4gaVI.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    
    <!-- Load fonts with font-display swap for instant text render -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"></noscript>
    
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Skip to Content (Accessibility) */
      .skip-to-content {
        position: absolute;
        left: -9999px;
        z-index: 999;
        padding: 1em;
        background-color: #000;
        color: #fff;
        text-decoration: none;
      }
      .skip-to-content:focus {
        left: 50%;
        transform: translateX(-50%);
        top: 0;
      }
      
      /* Critical styles for hero section - inline for faster LCP */
      body { 
        margin: 0; 
        font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      }
      .hero-section { 
        position: relative; 
        width: 100%; 
        contain: layout style paint;
      }
      .hero-image { 
        width: 100%; 
        height: auto; 
        display: block; 
        object-fit: cover;
        aspect-ratio: 16/9;
      }
      
      /* Prevent layout shift */
      #root { 
        min-height: 100vh;
        contain: layout style paint;
      }
      
      /* Reserve space for navigation to prevent CLS */
      nav { height: 64px; }
      
      /* Skeleton loader for hero to prevent CLS */
      .hero-section::before {
        content: '';
        display: block;
        padding-top: 56.25%; /* 16:9 aspect ratio */
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      }
      
      .hero-section img {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
    
    <!-- Defer Analytics - Load after LCP -->
    <script>
      window.addEventListener('load', function() {
        window.requestIdleCallback(function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX';
          document.head.appendChild(script);
          
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XXXXXXXXXX');
        });
      });
    </script>
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="dfgKmsUZeQVRLEv8G43WL9s9kmKj-Bv5FLev4TL_A_I" />
  </head>

  <body>
    <a href="#main-content" class="skip-to-content" aria-label="Skip to main content">Skip to Content</a>
    <div id="root"></div>
    <main id="main-content"></main>
    <!-- Load main app script with high priority -->
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
