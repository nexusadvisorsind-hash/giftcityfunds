    <link rel="preload" as="image" href="/images/gujrat.png" fetchpriority="high" type="image/png" imagesrcset="/images/gujrat.png 1644w" imagesizes="100vw">
    
    <!-- Fonts: Fraunces (display), Public Sans (body), IBM Plex Mono (data) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">

    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Skip to Content (Accessibility) */
      .skip-to-content {
        position: absolute;
        left: -9999px;
        z-index: 999;
        padding: 1em;
        background-color: #000;
        color: #fff;
        text-decoration: none;
      }
      .skip-to-content:focus {
        left: 50%;
        transform: translateX(-50%);
        top: 0;
      }
      
      /* Critical styles for hero section - inline for faster LCP */
      body {
        margin: 0;
        font-family: 'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #F5F4EF;
        color: #10182A;
      }
      .hero-section { 
        position: relative; 
        width: 100%; 
        contain: layout style paint;
      }
      .hero-image { 
        width: 100%; 
        height: 100%; 
        display: block; 
        object-fit: cover;
      }
      
      /* Prevent layout shift */
      #root { 
        min-height: 100vh;
        contain: layout style paint;
      }
      
      /* Reserve space for navigation to prevent CLS */
      nav { height: 64px; }
      
    </style>
    
    <!-- Defer Analytics - Load after critical resources -->
    <script>
      window.addEventListener('load', function() {
        window.requestIdleCallback(function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-RVTXNPKQDS';
          document.head.appendChild(script);
          
          script.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-RVTXNPKQDS');

        });
      });
    </script>

  <body>
    <a href="#main-content" class="skip-to-content" aria-label="Skip to main content">Skip to Content</a>

    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
